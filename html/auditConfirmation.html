<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Audit Confirmation</title>
</head>
<body style="background-color: lightgrey; text-align: center;">
<img src="/imgs/logo.png" alt="City Wide logo" style="width: 50%; max-width: 350px;"><br>

<h2 id="title"></h2>
<div id="emailsBox">
    <h3>Email sent to:</h3>
    <div id="emailsList"></div>
</div>
<br>
<button class="big" onclick="window.location.href='/index.php'">Home</button>

</body>
<script>
    let params = new URLSearchParams(document.location.search);
    let buildingName = params.get("buildingName");

    const title = document.getElementById("title");
    if(buildingName) {
        title.innerHTML = "Closet audit successfully submitted for <br>" + buildingName + ".";

        let emailsStr = params.get("emails");
        if(!emailsStr) {
            document.getElementById("emailsBox").style.display = "none";
        } else {
            const emailsList = document.getElementById("emailsList");
            const emails = emailsStr.split(",");
            emails.forEach(email => {
                const p = document.createElement("p");
                p.innerText = email;
                emailsList.appendChild(p);
            });
        }
    } else {
        title.innerHTML = "ERROR: invalid link."
    }
</script>
<style>
    body {
        width: 100%;
        height: 100%;
        margin: auto;
        padding: 30px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }
    h2, h3 {
        text-align: center;
    }
    #emailsList {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
    }
    #emailsList p {
        margin: 0;
        padding: 0;
    }
</style>
</html>
